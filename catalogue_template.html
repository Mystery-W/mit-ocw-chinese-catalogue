<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIT OCW 中文课程探索目录</title>
<style>
:root{--ink:#172b32;--muted:#5e7179;--paper:#f5f4ef;--line:#d7dfdc;--accent:#00695e;--gold:#e7bb69}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Microsoft YaHei","Segoe UI",sans-serif}a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}header{background:var(--ink);color:#fff;padding:42px max(24px,calc((100vw - 1360px)/2));border-bottom:5px solid var(--gold)}.eyebrow{font-size:12px;letter-spacing:2px;color:#c4d3ce}.headline{display:flex;justify-content:space-between;align-items:end;gap:24px}h1{font-size:clamp(28px,4vw,42px);line-height:1.3;margin:12px 0}header p{max-width:850px;margin:10px 0;color:#d6e0de}.total{font:500 44px/1.2 Georgia,serif}.total small{display:block;font:13px/1.6 "Microsoft YaHei",sans-serif;color:#c6d6d2}main{max-width:1410px;margin:auto;padding:26px 24px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}.searchbar{display:flex;gap:10px}.searchbar input{flex:1;min-width:100px;padding:13px;border:1px solid #a2b7af;border-radius:7px;font-size:17px}.solid{background:var(--accent);color:white;border:0;border-radius:7px;padding:10px 20px}.plain{background:#fff;color:var(--ink);border:1px solid #bdccc5;border-radius:7px;padding:9px 15px}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;margin-top:20px}label{display:block;font-size:13px;color:var(--muted)}select{display:block;width:100%;margin-top:5px;padding:9px 7px;border:1px solid #bdccc5;border-radius:6px;background:#fff;color:var(--ink)}.hint{font-size:13px;color:var(--muted);margin:10px 0 0}.explore{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}.chip{background:#edf4f0;border:1px solid #d2e2d9;border-radius:20px;padding:5px 13px;color:#285c4d}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 16px}.toolbar strong{font-size:19px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.course{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;padding:21px;border-top:3px solid #b8cec3}.course.video{border-top-color:var(--accent)}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.code{font-family:Consolas,monospace;color:var(--accent);font-weight:bold}.course h2{font-size:19px;line-height:1.5;margin:12px 0 3px}.en{color:var(--muted);font-size:13px;line-height:1.45}.tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;padding:2px 7px;background:#edf2ef;border-radius:4px}.resource{color:#175e50;background:#e7f3ed}.desc{font-size:13px;color:#52636b;line-height:1.65;margin:14px 0;overflow-wrap:anywhere}.actions{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px;border-top:1px solid #edf0ec;font-size:13px}.linkbutton{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-align:left}.pagination{display:flex;gap:14px;justify-content:center;align-items:center;margin:28px 0}button:disabled{opacity:.4;cursor:default}.empty{text-align:center;padding:50px;color:var(--muted);grid-column:1/-1}.method{margin-top:28px;font-size:13px;color:var(--muted)}.method summary{font-weight:bold;color:var(--ink);cursor:pointer}.method li{margin:8px 0}.method p{max-width:1100px}dialog{border:0;border-radius:14px;max-width:1050px;width:94vw;max-height:90vh;padding:30px;box-shadow:0 10px 90px #0004;color:var(--ink)}dialog::backdrop{background:#112a36aa}.dialogtop{display:flex;gap:24px;justify-content:space-between;align-items:start}.dialogtop h2{margin:4px 0;font-size:26px}.close{padding:5px 13px;font-size:20px}.full-description{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:15px;background:#f6f7f3;padding:20px;border-radius:8px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.detailgrid ul{padding-left:20px;overflow-wrap:anywhere}.detailgrid h3{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:7px}.notice{background:#fff5df;padding:12px 16px;border-left:3px solid var(--gold);font-size:13px;margin:18px 0}.detailfields{font-size:14px;margin:16px 0}.detailfields p{margin:7px 0}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e7bb69;outline-offset:3px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.grid,.detailgrid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.headline{display:block}.total{font-size:28px;margin-top:22px}.toolbar{align-items:start;flex-direction:column}.searchbar{flex-wrap:wrap}.searchbar input{flex-basis:100%}header{padding:28px 20px}main{padding:20px 12px}.panel{padding:16px}dialog{padding:20px}.dialogtop h2{font-size:22px}}
</style></head>
<body><header><div class="eyebrow">独立学习 · 跨学科探索 · MIT OPENCOURSEWARE</div><div class="headline"><div><h1>从好奇心出发，找到下一门课。</h1><p>用中文标题与学科标签探索 MIT 的开放学习资料。先看资源类型，再进入课程；不同年份与学期分别保留。</p></div><div class="total" id="total"></div></div></header>
<main><section class="panel" aria-label="课程筛选"><form id="searchform"><div class="searchbar"><input id="q" aria-label="搜索课程" placeholder="输入中文、英文或课程代码，例如：音乐 计算、语言、6.0001" autocomplete="off"><button class="solid" type="submit">搜索课程</button><button class="plain" id="reset" type="button">重置</button></div></form>
<p class="hint">多个关键词用空格分隔，需同时匹配。检索范围含中英文标题、学科、院系、资源类型与官方英文简介。</p>
<div class="filters"><label>学科一<select id="topic1"><option value="">全部学科</option></select></label><label>同时属于学科二<select id="topic2"><option value="">不限交叉学科</option></select></label><label>学习资源类型<select id="resource"><option value="">全部资源类型</option></select></label><label>学术级别<select id="level"><option value="">全部级别</option><option value="Undergraduate">本科</option><option value="Graduate">研究生</option><option value="Non-Credit">非学分</option></select></label><label>排序<select id="sort"><option value="code">课程代码</option><option value="year_desc">年份从新到旧</option><option value="year_asc">年份从旧到新</option><option value="title">中文标题</option></select></label></div>
<div class="explore"><span class="hint">从一个方向开始：</span><button class="chip" data-topic="语言学">语言学</button><button class="chip" data-topic="音乐">音乐</button><button class="chip" data-topic="电影与视频">电影与视频</button><button class="chip" data-topic="认知科学">认知科学</button><button class="chip" data-topic="人工智能">人工智能</button><button class="chip" data-topic="人类学">人类学</button><button class="chip" data-topic="概率与统计">概率与统计</button><button class="chip" data-topic="哲学">哲学</button></div></section>
<div class="toolbar"><div><strong id="resultcount" role="status" aria-live="polite"></strong><span class="hint" id="pagesummary"></span></div><button class="plain" id="export">导出当前筛选结果 CSV</button></div>
<section class="grid" id="results" aria-label="课程结果"></section><nav class="pagination" aria-label="翻页"><button class="plain" id="prev">上一页</button><span id="pageno"></span><button class="plain" id="next">下一页</button></nav>
<details class="panel method"><summary>目录范围、资源分类与核查说明</summary><div id="method"></div></details>
</main><footer>来源：MIT OpenCourseWare。中文辅助译名与目录整理不代表 MIT 官方译本或认可。</footer>
<dialog id="detail"><div class="dialogtop"><div id="detailtitle"></div><button class="plain close" id="close" aria-label="关闭课程详情">×</button></div><div id="detailbody"></div></dialog>
<script id="catalogue-data" type="application/json">__CATALOGUE_DATA__</script>
<script>
// Embedded JSON keeps the catalogue portable and functional under file://.
const payload=JSON.parse(document.getElementById('catalogue-data').textContent);
const courses=payload.courses, byId=new Map(courses.map(c=>[c.id,c]));
const $=id=>document.getElementById(id), escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Only public HTTP(S) links are rendered as clickable URLs.
const link=(url,label)=>/^https?:\/\//i.test(url)?`<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(label)}</a>`:escapeHTML(label);
const levelNames={'Undergraduate':'本科','Graduate':'研究生','Non-Credit':'非学分'};
let filtered=[],page=1; const pageSize=30;
const searchable=new Map(courses.map(c=>[c.id,[c.course_code,c.extra_course_codes,c.title_en,c.title_zh,c.description_en,...c.topics,...c.topics_zh,...c.departments,...c.departments_zh,...c.features_zh].join(' ').normalize('NFKC').toLowerCase()]));
const topicCounts=new Map(); for(const c of courses)for(const t of new Set(c.topics_zh))topicCounts.set(t,(topicCounts.get(t)||0)+1);
for(const [name,count] of [...topicCounts].sort((a,b)=>a[0].localeCompare(b[0],'zh-CN'))){for(const id of ['topic1','topic2'])$(id).add(new Option(`${name}（${count}）`,name));}
$('resource').add(new Option(`所有有授课视频证据（含站外，${courses.filter(c=>c.has_lecture_video).length}）`,'lecture_any'));
$('resource').add(new Option(`有外部 MOOC / 在线课程入口（${courses.filter(c=>c.mooc_links.length).length}）`,'mooc'));
for(const key of Object.keys(payload.rules)){const count=payload.audit.resource_counts[key]||0;if(count)$('resource').add(new Option(`${key}（${count}）`,key));}
$('total').innerHTML=`${courses.length.toLocaleString()}<small>课程版本与开放资源条目 · 2026-11-17 快照</small>`;
$('method').innerHTML=`<p>公开搜索接口与课程站点地图交叉核对，均为 ${payload.audit.coverage.search_total} 个课程版本，差集为空。逐门读取官方元数据及课程首页。另检查 ${payload.audit.resource_entry_checks} 个资源入口页面，全部返回 HTTP 200；未逐个验证媒体播放。抓取时间见各课程详情。</p><p>本目录收集课程级信息与资源入口，未下载全部视频、PDF、作业附件或字幕。官方英文简介完整保留。中文标题与学科译名由 AI 辅助生成，非官方译本，尚未经逐项专业审校。</p><ul>${Object.entries(payload.rules).map(([k,v])=>`<li><strong>${escapeHTML(k)}</strong>：${escapeHTML(v)}</li>`).join('')}</ul><p>类型按主要学习形式归类，不是课程质量评分。视频标志表示发现官网标签或导航证据，不保证全套讲次齐全或每个视频都能在当前网络播放。外部 MOOC 的报名、收费与播放状态未逐项验证。未发现资源不等于“不开放”。</p><p>本科/研究生是官方学术级别，不是入门难度判断。RES 标识开放或补充资源，也可包含成套课程。双学科筛选采用 MIT 原有标签，不是额外推断。</p><p>来源：${link('https://ocw.mit.edu/search/','MIT OCW 搜索')}；${link('https://ocw.mit.edu/sitemap.xml','课程站点地图')}。页面元数据所示许可：${link('https://creativecommons.org/licenses/by-nc-sa/4.0/','CC BY-NC-SA 4.0')}；外链及个别素材可能有不同许可。</p>`;

/** Apply all selected conditions; missing years always sort to the end. */
function filterCourses(){const terms=$('q').value.trim().normalize('NFKC').toLowerCase().split(/\s+/).filter(Boolean);const t1=$('topic1').value,t2=$('topic2').value,res=$('resource').value,level=$('level').value;
filtered=courses.filter(c=>terms.every(t=>searchable.get(c.id).includes(t))&&(!t1||c.topics_zh.includes(t1))&&(!t2||c.topics_zh.includes(t2))&&(!res||(res==='lecture_any'?c.has_lecture_video:res==='mooc'?c.mooc_links.length>0:c.resource_category===res))&&(!level||c.academic_level.includes(level)));
const mode=$('sort').value;filtered.sort((a,b)=>{if(mode.startsWith('year')){const ay=Number(a.year),by=Number(b.year);if(!ay||!by)return ay?-1:by?1:0;return(mode==='year_desc'?by-ay:ay-by)||a.course_code.localeCompare(b.course_code);}return mode==='title'?a.title_zh.localeCompare(b.title_zh,'zh-CN'):a.course_code.localeCompare(b.course_code,'en',{numeric:true})||Number(b.year)-Number(a.year);});page=1;render();}

/** Render only the current page, keeping full descriptions in the detail dialog. */
function render(){const pages=Math.max(1,Math.ceil(filtered.length/pageSize)),start=(page-1)*pageSize;$('resultcount').textContent=`找到 ${filtered.length.toLocaleString()} 个条目`;$('pagesummary').textContent=filtered.length?`　显示 ${start+1}–${Math.min(start+pageSize,filtered.length)}`:'';
$('results').innerHTML=filtered.slice(start,start+pageSize).map(c=>`<article class="course ${c.has_lecture_video?'video':''}"><div class="meta"><span class="code">${escapeHTML(c.course_code||'未标注代码')}</span><span>${escapeHTML(c.year)} ${escapeHTML(c.term)}</span></div><h2><button class="linkbutton" style="font:inherit;color:inherit" data-open="${escapeHTML(c.id)}">${escapeHTML(c.title_zh)}</button></h2><div class="en">${escapeHTML(c.title_en)}</div><div class="tags"><span class="tag resource">${escapeHTML(c.resource_category.substring(2))}</span>${c.academic_level.map(l=>`<span class="tag">${escapeHTML(levelNames[l]||l)}</span>`).join('')}</div><div class="tags">${c.topics_zh.slice(0,5).map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('')}${c.topics_zh.length>5?'<span class="tag">更多学科见详情</span>':''}</div><p class="desc" lang="en">${escapeHTML(c.description_en.slice(0,210))}${c.description_en.length>210?'…':''}</p><div class="actions"><button class="linkbutton" data-open="${escapeHTML(c.id)}">简介与学习入口 →</button>${link(c.course_url,'MIT 原页 ↗')}</div></article>`).join('')||'<div class="empty">没有匹配条目。试着减少关键词，或取消一个学科筛选。</div>';
$('pageno').textContent=`${page} / ${pages}`;$('prev').disabled=page===1;$('next').disabled=page===pages;}

/** Show evidence, source metadata and all navigation links without executing source HTML. */
function openDetail(id){const c=byId.get(id);if(!c)return;$('detailtitle').innerHTML=`<div class="code">${escapeHTML(c.course_code)} · ${escapeHTML(c.year)} ${escapeHTML(c.term)}</div><h2>${escapeHTML(c.title_zh)}</h2><div class="en">${escapeHTML(c.title_en)}</div>`;
const fields=[['学习内容类型',c.resource_category],['院系',c.departments_zh.join('；')],['学科路径',c.topic_paths_zh.map(p=>p.join(' › ')).join('；')],['官方资源标签',c.features_zh.join('；')||'未列出'],['学术级别',c.academic_level.map(l=>levelNames[l]||l).join('；')],['交叉课程代码',c.extra_course_codes||'未标注'],['教师',c.instructors.join('；')||'未标注'],['条目性质',c.entry_type]];
$('detailbody').innerHTML=`<div class="detailfields">${fields.map(([k,v])=>`<p><strong>${escapeHTML(k)}：</strong>${escapeHTML(v)}</p>`).join('')}</div><div class="notice">${escapeHTML(c.classification_basis)}${c.external_only&&c.has_lecture_video?' 官网另有授课视频标注，内容位于外部平台。':''}</div><h3>课程介绍 · 官方英文全文</h3><div class="full-description" lang="en">${escapeHTML(c.description_en||'官网未提供简介。')}</div><div class="detailgrid"><section><h3>课程提供的学习入口</h3><ul>${c.resource_links.map(x=>`<li>${link(x.url,x.label)}${new URL(x.url).hostname!=='ocw.mit.edu'?' <small>（站外）</small>':''}</li>`).join('')||'<li>未提取到导航入口</li>'}</ul></section><section><h3>来源与核查</h3><p>${link(c.course_url,'打开课程首页')} · ${link(c.metadata_url,'查看官方元数据')}</p>${c.download_links.map(u=>`<p>${link(u,'课程下载页面')}</p>`).join('')}<p>${escapeHTML(c.entry_check)}</p><p>首页抓取：${escapeHTML(c.capture_status)}<br>抓取时间：${escapeHTML(c.captured_at)}</p><p class="hint">中文标题为辅助译名，非官方中文名称。简介与英文原题保留官网内容。目录不代表学分课程注册，未逐个验证视频播放和外部课程收费。</p>${c.mooc_links.length?'<h3>MOOC / 在线课程外链</h3>'+c.mooc_links.map(u=>`<p>${link(u,u)}</p>`).join(''):''}</section></div>`;$('detail').showModal();}

/** Export the current filtered rows with BOM and spreadsheet formula escaping. */
function exportCSV(){const columns=[['课程代码','course_code'],['课程标题（英文）','title_en'],['课程标题（中文辅助译名）','title_zh'],['学科类别','topics_zh'],['开放学习内容类型','resource_category'],['课程介绍（官方英文全文）','description_en'],['课程链接','course_url'],['主要学习入口','primary_resource_url'],['资源标签','features_zh'],['学术级别','academic_level'],['年份','year'],['学期','term']];const cell=v=>{let s=Array.isArray(v)?v.join('；'):String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const csv='\ufeff'+[columns.map(x=>cell(x[0])).join(','),...filtered.map(c=>columns.map(x=>cell(c[x[1]])).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=u;a.download=`MIT_OCW_筛选结果_${filtered.length}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('searchform').addEventListener('submit',e=>{e.preventDefault();filterCourses();});let debounce;$('q').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(filterCourses,180);});for(const id of ['topic1','topic2','resource','level','sort'])$(id).addEventListener('change',filterCourses);
$('reset').onclick=()=>{$('q').value='';for(const id of ['topic1','topic2','resource','level'])$(id).value='';$('sort').value='code';filterCourses();};
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{$('q').value='';$('topic1').value=b.dataset.topic;$('topic2').value='';filterCourses();});
$('results').onclick=e=>{const target=e.target.closest('[data-open]');if(target)openDetail(target.dataset.open);};$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>{page--;render();$('resultcount').scrollIntoView({block:'start'});};$('next').onclick=()=>{page++;render();$('resultcount').scrollIntoView({block:'start'});};$('export').onclick=exportCSV;filterCourses();
</script></body></html>
